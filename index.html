<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <!-- メタタグ・ファビコン -->
  <link rel="icon" href="https://raw.githubusercontent.com/hideyan1017/LEAP/refs/heads/main/leap.png">
  <meta property="og:type" content="article" />
  <link rel="apple-touch-icon" sizes="180x180" href="https://raw.githubusercontent.com/hideyan1017/LEAP/refs/heads/main/leap.png">

  <link rel="icon" type="image/png" sizes="32x32" href="https://raw.githubusercontent.com/hideyan1017/LEAP/refs/heads/main/leap.png">
  <link rel="icon" type="image/png" sizes="16x16" href="https://raw.githubusercontent.com/hideyan1017/LEAP/refs/heads/main/leap.png">

  <meta property="og:title" content="『LEAP 改訂版』タイピング" />
  <meta property="og:description" content="リプタイピングへようこそ" />
  <meta property="og:image" content="https://raw.githubusercontent.com/hideyan1017/LEAP/refs/heads/main/leap%20%E3%83%AD%E3%82%B4.png" />

  <title>リプタイピング</title>
  <!-- リアルタイム対戦用 PeerJS ライブラリ -->
  <script src="https://unpkg.com/peerjs@1.5.2/dist/peerjs.min.js"></script>
  <style>
    :root {
      --bg-color: #f6f0de;
      --card-bg: #ffffff;
      --text-main: #1e293b;
      --accent-blue: #0284c7;
      --accent-green: #16a34a;
      --accent-red: #dc2626;
      --border-color: #cbd5e1;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      user-select: none;
      -webkit-tap-highlight-color: transparent;
    }

    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      background-color: var(--bg-color);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
    }

    .container {
      width: 100%;
      max-width: 600px;
      background: var(--card-bg);
      border-radius: 12px;
      padding: 2rem;
      box-shadow: 0 10px 25px rgba(0, 0, 0, 0.08);
      border: 1px solid var(--border-color);
      position: relative;
    }

    .screen { display: none; }
    .screen.active { display: block; }

    /* 左上のボタン用スタイル */
    .btn-top-left {
      position: absolute;
      top: 1rem;
      left: 1rem;
      padding: 0.3rem 0.6rem;
      border: none;
      border-radius: 4px;
      background: #64748b;
      color: white;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
      z-index: 5;
    }
    .btn-top-left:hover {
      background: #475569;
    }

    h1 {
      text-align: center;
      color: var(--text-main);
      margin-bottom: 0.5rem;
      font-size: 1.6rem;
      font-weight: 700;
    }

    p.subtitle {
      text-align: center;
      color: #64748b;
      margin-bottom: 1.5rem;
      font-size: 0.9rem;
    }

    .card {
      background: #f8fafc;
      border-radius: 8px;
      padding: 1.2rem;
      border: 1px solid var(--border-color);
      margin-bottom: 1.2rem;
    }

    .form-group { margin-bottom: 1.2rem; }

    label {
      display: block;
      margin-bottom: 0.4rem;
      color: #475569;
      font-size: 0.85rem;
      font-weight: 600;
    }

    input[type="text"], input[type="number"], select {
      width: 100%;
      padding: 0.65rem;
      border-radius: 6px;
      border: 1px solid var(--border-color);
      background: #ffffff;
      color: var(--text-main);
      font-size: 0.95rem;
    }

    .range-inputs {
      display: flex;
      gap: 0.5rem;
      align-items: center;
    }

    .btn-primary {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.8rem;
    }

    .btn-primary:hover {
      background: #0369a1;
    }

    .btn-secondary {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #64748b;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.8rem;
    }

    .btn-secondary:hover {
      background: #475569;
    }

    .btn-danger {
      width: 100%;
      padding: 0.8rem;
      border: none;
      border-radius: 6px;
      background: #dc2626;
      color: white;
      font-weight: 600;
      font-size: 1rem;
      cursor: pointer;
      transition: background 0.15s;
      margin-bottom: 0.8rem;
    }
    .btn-danger:hover {
      background: #b91c1c;
    }

    .btn-copy {
      padding: 0.6rem 1rem;
      border: none;
      border-radius: 6px;
      background: #0284c7;
      color: white;
      font-weight: 600;
      font-size: 0.85rem;
      cursor: pointer;
      margin-top: 0.5rem;
      width: 100%;
    }

    .btn-quit {
      padding: 0.3rem 0.6rem;
      border: none;
      border-radius: 4px;
      background: #cbd5e1;
      color: #334155;
      font-weight: 600;
      font-size: 0.8rem;
      cursor: pointer;
    }
    .btn-quit:hover {
      background: #ef4444;
      color: white;
    }

    .game-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      margin-bottom: 0.8rem;
      font-weight: 600;
      color: #64748b;
      font-size: 0.85rem;
    }

    .score-board {
      background: #f8fafc;

      border-radius: 6px;
      padding: 0.6rem 1rem;
      margin-bottom: 1rem;
      display: flex;
      flex-direction: column;
      gap: 0.3rem;
      font-size: 0.85rem;
      max-height: 120px;
      overflow-y: auto;
    }

    .score-row {
      display: flex;
      justify-content: space-between;
    }

    .timer-bar-container {
      width: 100%;
      height: 8px;
      background: #e2e8f0;
      border-radius: 4px;
      overflow: hidden;
      margin-bottom: 1.2rem;
      border: 1px solid var(--border-color);
    }

    .timer-bar {
      height: 100%;
      width: 100%;
      background: #0284c7;
      transition: width 0.1s linear;
    }

    .japanese-word {
      text-align: center;
      font-size: 1.4rem;
      font-weight: 700;
      color: var(--text-main);
      min-height: 2.2rem;
    }

    .word-display {
      display: flex;
      justify-content: center;
      gap: 0.3rem;
      margin-top: 1rem;
      flex-wrap: wrap;
    }

    .char-box {
      width: 2.2rem;
      height: 2.8rem;
      background: #ffffff;
      border: 1px solid var(--border-color);
      border-radius: 6px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 1.4rem;
      font-weight: 700;
      font-family: monospace;
      color: #64748b;
    }

    .char-box.filled {
      background: #e0f2fe;
      color: #0369a1;
      border-color: #0284c7;
    }

    .char-box.current {
      background: #ffffff;
      border-color: #0284c7;
    }

    .choices-row {
      display: flex;
      justify-content: space-between;
      gap: 0.5rem;
      margin-bottom: 1rem;
    }

    .choice-btn {
      flex: 1;
      height: 3.8rem;
      font-size: 1.5rem;
      font-weight: 700;
      background: #ffffff;
      color: var(--text-main);
      border: 1px solid var(--border-color);
      border-radius: 8px;
      cursor: pointer;
      font-family: monospace;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.1s;
      outline: none;
      -webkit-tap-highlight-color: transparent;
    }

    .choice-btn:hover {
      background: #f1f5f9;
    }

    .choice-btn:focus, .choice-btn:active {
      outline: none;
      box-shadow: none;
      background: #e2e8f0;
    }

      background: #ffffff;

      font-family: monospace;

      max-height: 200px;

    }

      margin-bottom: 0.4rem;

      justify-content: space-between;
      align-items: center;

    .msg-overlay {

      border: 1px solid var(--border-color);

      padding: 1.2rem;
      text-align: center;
      margin-top: 1rem;
    }

    #countdown-overlay {
      position: absolute;
      top: 0; left: 0; width: 100%; height: 100%;
      background: #ffffff;
      display: flex;
      flex-direction: column;
      justify-content: center;
      align-items: center;
      z-index: 10;
      border-radius: 12px;
    }
    #countdown-number {
      font-size: 5rem;
      font-weight: 800;
      color: #0284c7;
    }
  </style>
</head>

<div class="container">

    <h1>LEAP<br>早押しタイピング</h1>
    <p class="subtitle">製作者：<a href="https://x.com/syokuennsu1" style="color: #d2b48c;">食縁水</a></p>
    
    <div class="card">
      <button class="btn-primary" onclick="goToSoloSetup()">1人用モード</button>
      <button class="btn-secondary" onclick="goToMultiLobby()">オンライン対戦モード (最大8人)</button>

  <!-- 1人用 設定画面 -->
  <div id="solo-setup-screen" class="screen">
    <h1>1人用モード設定</h1>
    <p class="subtitle">出題範囲と問題数の選択</p>

    <div class="card">
      <div class="form-group">

      <div class="form-group">

        <select id="preset-select" onchange="applyPreset('solo')">

    <h1>オンライン対戦 (最大8人)</h1>

    <div class="card">

        <label>プレイヤー名 (必須)</label>
        <input type="text" id="multi-player-name" placeholder="名前を入力" maxlength="10" value="プレイヤー">

        <div class="form-group">

        <div class="form-group">

          <div class="range-inputs">

            <span>〜</span>
            <input type="number" id="multi-end-num" value="2027" min="1" max="2027">

        <div class="form-group" style="margin-bottom:0;">

    </div>
  </div>
</div>

<script>
// 音声システム
let audioCtx = null;
function initAudio() {
  if (!audioCtx) audioCtx = new (window.AudioContext || window.webkitAudioContext)();
  if (audioCtx.state === 'suspended') audioCtx.resume();
}

function playSound(type) {
  try {
    initAudio();
    if (!audioCtx) return;
    const now = audioCtx.currentTime;

    if (type === 'type') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'triangle';
      osc.frequency.setValueAtTime(1200, now);
      osc.frequency.exponentialRampToValueAtTime(80, now + 0.025);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.001, now + 0.025);
      osc.start(now); osc.stop(now + 0.025);
    } else if (type === 'char_correct') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(800, now);
      osc.frequency.setValueAtTime(1200, now + 0.05);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'word_correct') {
      const notes = [523.25, 659.25, 783.99, 1046.5];
      notes.forEach((freq, idx) => {
        const osc = audioCtx.createOscillator();
        const gain = audioCtx.createGain();
        osc.connect(gain); gain.connect(audioCtx.destination);
        const startTime = now + idx * 0.07;
        osc.type = 'sine';
        osc.frequency.setValueAtTime(freq, startTime);
        gain.gain.setValueAtTime(0.18, startTime);
        gain.gain.linearRampToValueAtTime(0.001, startTime + 0.15);
        osc.start(startTime); osc.stop(startTime + 0.15);
      });
    } else if (type === 'miss') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sawtooth';
      osc.frequency.setValueAtTime(150, now);
      osc.frequency.setValueAtTime(100, now + 0.15);
      gain.gain.setValueAtTime(0.25, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.3);
      osc.start(now); osc.stop(now + 0.3);
    } else if (type === 'count') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(600, now);
      gain.gain.setValueAtTime(0.15, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.1);
      osc.start(now); osc.stop(now + 0.1);
    } else if (type === 'count_start') {
      const osc = audioCtx.createOscillator();
      const gain = audioCtx.createGain();
      osc.connect(gain); gain.connect(audioCtx.destination);
      osc.type = 'sine';
      osc.frequency.setValueAtTime(1046.5, now);
      gain.gain.setValueAtTime(0.2, now);
      gain.gain.linearRampToValueAtTime(0.01, now + 0.25);
      osc.start(now); osc.stop(now + 0.25);
    }
  } catch (e) {
    console.log(e);
  }
}

// -------------------------------------------------------------
// 英単語 データ

[2292, "rigid", "硬い／(規則・行為・人などが)厳格な"],

[2295, "superficial", "表面的な"],

[2299, "feasible", "(計画・方法などが)実現[実行]可能な"],

];

const wordsDatabase = [];
const rawMap = new Map();
rawWords.forEach(item => rawMap.set(item[0], { en: item[1].toLowerCase(), jp: item[2] }));

for (let i = 1; i <= 2300; i++) {
  if (rawMap.has(i)) {
    wordsDatabase.push({ id: i, en: rawMap.get(i).en, jp: rawMap.get(i).jp });
  } else {
    wordsDatabase.push({ id: i, en: "word" + i, jp: "単語の日本語訳 (" + i + ")" });
  }
}

// ゲーム状態
let mode = 'solo';
let currentQuizList = [];
let currentQuestionIndex = 0;
let currentWord = null;
let currentCharIndex = 1; 
let correctCount = 0;
let timeLeft = 6.0;
const MAX_TIME = 6.0;
let timerId = null;
let isAnswerable = false;

// マルチプレイ管理
const MAX_PLAYERS = 8;
let peer = null;
let hostConnMap = new Map();
let guestConn = null;
let myPeerId = "";
let myName = "";
let roomId = "";
let isHost = false;
let isGameStarted = false;
let playersList = [];

window.onload = function() {
  const params = new URLSearchParams(window.location.search);
  const r = params.get('room');
  if (r) {
    document.getElementById('room-id-input').value = r;
    switchScreen('multi-lobby-screen');
    mode = 'multi';
  }
};

function switchScreen(screenId) {
  document.querySelectorAll('.screen').forEach(s => s.classList.remove('active'));
  document.getElementById(screenId).classList.add('active');
}

function goToSoloSetup() {
  mode = 'solo';
  switchScreen('solo-setup-screen');
}

function goToMultiLobby() {
  mode = 'multi';
  switchScreen('multi-lobby-screen');
  const r = document.getElementById('room-id-input').value;
  if (r) {
    document.getElementById('room-id-input').value = r;
  }
}

function applyPreset(targetMode) {
  const prefix = targetMode === 'multi' ? 'multi-' : '';
  const val = document.getElementById(prefix + 'preset-select').value;
  const startInput = document.getElementById(prefix + 'start-num');
  const endInput = document.getElementById(prefix + 'end-num');

  if (val === 'all') { startInput.value = 1; endInput.value = 2027; }
}

function startSoloGame() {
  const nameInput = document.getElementById('solo-player-name').value.trim();
  if (!nameInput) {
    alert('プレイヤー名を入力してください。');
    document.getElementById('solo-player-name').focus();
    return;
  }
  myName = nameInput;

  const startNum = parseInt(document.getElementById('start-num').value) || 1;
  const endNum = parseInt(document.getElementById('end-num').value) || 2027;
  const qCount = parseInt(document.getElementById('question-count').value);

  const filtered = wordsDatabase.filter(w => w.id >= startNum && w.id <= endNum);
  if (filtered.length === 0) {
    alert('指定範囲内に単語がありません。');
    return;
  }

  currentQuizList = [...filtered].sort(() => Math.random() - 0.5).slice(0, qCount);
  currentQuestionIndex = 0;
  correctCount = 0;

  switchScreen('game-screen');
  document.getElementById('score-board').style.display = 'none';
  
  runCountdown(() => {
    loadQuestion();
  });
}

function runCountdown(callback) {
  const overlay = document.getElementById('countdown-overlay');
  const numEl = document.getElementById('countdown-number');
  overlay.style.display = 'flex';
  
  let count = 3;
  numEl.innerText = count;
  playSound('count');

  const countInterval = setInterval(() => {
    count--;
    if (count > 0) {
      numEl.innerText = count;
      playSound('count');
    } else if (count === 0) {
      numEl.innerText = "スタート";
      playSound('count_start');
    } else {
      clearInterval(countInterval);
      overlay.style.display = 'none';
      callback();
    }
  }, 800);
}

function generateMultiQuizList() {
  const startNum = parseInt(document.getElementById('multi-start-num').value) || 1;
  const endNum = parseInt(document.getElementById('multi-end-num').value) || 2027;
  const qCount = parseInt(document.getElementById('multi-question-count').value) || 10;

  const filtered = wordsDatabase.filter(w => w.id >= startNum && w.id <= endNum);
  if (filtered.length === 0) {
    alert('指定範囲内に単語がありません。');
    return null;
  }
  return [...filtered].sort(() => Math.random() - 0.5).slice(0, qCount);
}

// 通信処理
function broadcast(data) {
  if (isHost) {
    hostConnMap.forEach(conn => {
      if (conn && conn.open) conn.send(data);
    });
  } else if (guestConn && guestConn.open) {
    guestConn.send(data);
  }
}

function createRoom() {
  const nameInput = document.getElementById('multi-player-name').value.trim();
  if (!nameInput) {
    alert('プレイヤー名を入力してください。');
    document.getElementById('multi-player-name').focus();
    return;
  }
  myName = nameInput;
  isHost = true;
  isGameStarted = false;
  hostConnMap.clear();

  const sixDigitId = String(Math.floor(Math.random() * 1000000)).padStart(6, '0');

  document.getElementById('multi-create-card').style.display = 'none';
  document.getElementById('multi-join-card').style.display = 'none';
  document.getElementById('room-waiting-box').style.display = 'block';
  document.getElementById('host-settings-card').style.display = 'block';
  document.getElementById('host-close-room-btn').style.display = 'block';
  document.getElementById('guest-leave-btn').style.display = 'none';
  document.getElementById('lobby-back-btn').style.display = 'none';

  peer = new Peer(sixDigitId);
  peer.on('open', (id) => {
    myPeerId = id;
    roomId = id;
    playersList = [{ id: myPeerId, name: myName, score: 0, finishedQ: false }];
    
    document.getElementById('room-id-display').innerText = roomId;
    const shareUrl = location.protocol + '//' + location.host + location.pathname + '?room=' + roomId;
    document.getElementById('share-url-display').innerText = shareUrl;
    renderLobbyPlayerList();
  });

  peer.on('error', (err) => {
    if (err.type === 'unavailable-id') {
      createRoom();
    } else {
      alert('エラーが発生しました: ' + err.type);
    }
  });

  peer.on('connection', (c) => {
    if (isGameStarted) {
      c.on('open', () => {
        c.send({ type: 'STARTED' });
        setTimeout(() => c.close(), 500);
      });
      return;
    }

    if (playersList.length >= MAX_PLAYERS) {
      c.on('open', () => {
        c.send({ type: 'FULL' });
        setTimeout(() => c.close(), 500);
      });
      return;
    }

    c.on('open', () => {
      hostConnMap.set(c.peer, c);
      broadcastState();
    });

    setupConnListeners(c);
  });
}

function joinRoom() {
  const nameInput = document.getElementById('multi-player-name').value.trim();
  if (!nameInput) {
    alert('プレイヤー名を入力してください。');
    document.getElementById('multi-player-name').focus();
    return;
  }
  myName = nameInput;

  roomId = document.getElementById('room-id-input').value.trim();
  if (!roomId) {
    alert('ルームIDまたはURLを入力してください。');
    return;
  }
  if (roomId.includes('?room=')) {
    roomId = roomId.split('?room=')[1];
  }

  isHost = false;
  isGameStarted = false;
  document.getElementById('multi-create-card').style.display = 'none';
  document.getElementById('multi-join-card').style.display = 'none';
  document.getElementById('room-waiting-box').style.display = 'block';
  document.getElementById('host-settings-card').style.display = 'none';
  document.getElementById('host-close-room-btn').style.display = 'none';
  document.getElementById('guest-leave-btn').style.display = 'block';
  document.getElementById('lobby-back-btn').style.display = 'none';

  peer = new Peer();
  peer.on('open', (id) => {
    myPeerId = id;
    guestConn = peer.connect(roomId);
    
    guestConn.on('open', () => {
      guestConn.send({ type: 'JOIN', name: myName, peerId: myPeerId });
      document.getElementById('room-id-display').innerText = roomId;
    });

    setupConnListeners(guestConn);
  });
}

function setupConnListeners(c) {
  c.on('data', (data) => {
    if (data.type === 'FULL') {
      alert('この部屋はすでに満員（8人）です。');
      leaveRoomAndHome();
    } else if (data.type === 'STARTED') {
      alert('この部屋はすでに試合が始まっているため参加できません。');
      leaveRoomAndHome();
    } else if (data.type === 'JOIN' && isHost) {
      if (isGameStarted) {
        c.send({ type: 'STARTED' });
        setTimeout(() => c.close(), 500);
        return;
      }
      if (!playersList.some(p => p.id === data.peerId)) {
        playersList.push({ id: data.peerId, name: data.name, score: 0, finishedQ: false });
      }
      broadcastState();
    } else if (data.type === 'STATE_UPDATE') {
      playersList = data.playersList;
      renderLobbyPlayerList();
    } else if (data.type === 'START_GAME') {
      isGameStarted = true;
      currentQuizList = data.quizList;
      currentQuestionIndex = 0;
      correctCount = 0;
      playersList.forEach(p => { p.score = 0; p.finishedQ = false; });

      switchScreen('game-screen');
      document.getElementById('score-board').style.display = 'flex';
      
      runCountdown(() => {
        loadQuestion();
      });
    } else if (data.type === 'NEXT_QUESTION') {
      currentQuizList = data.quizList;
      currentQuestionIndex = data.questionIndex;
      playersList = data.playersList;
      
      switchScreen('game-screen');
      loadQuestion();
    } else if (data.type === 'SHOW_RESULT') {
      playersList = data.playersList;
      showResult();
    } else if (data.type === 'BACK_TO_LOBBY') {
      isGameStarted = false;
      switchScreen('multi-lobby-screen');
      document.getElementById('host-settings-card').style.display = isHost ? 'block' : 'none';
      document.getElementById('room-waiting-box').style.display = 'block';
      document.getElementById('host-start-btn').style.display = isHost ? 'block' : 'none';
      document.getElementById('host-close-room-btn').style.display = isHost ? 'block' : 'none';
      document.getElementById('guest-wait-msg').style.display = isHost ? 'none' : 'block';
      document.getElementById('guest-leave-btn').style.display = isHost ? 'none' : 'block';
    } else if (data.type === 'PLAYER_FINISH_Q') {
      if (isHost) {
        const p = playersList.find(item => item.id === data.peerId);
        if (p) {
          p.score = data.score;
          p.finishedQ = true;
        }
        broadcastState();
        checkAllFinishedQuestion();
      }
    } else if (data.type === 'CLOSE_ROOM') {
      alert('ホストが部屋を解散しました。');
      leaveRoomAndHome();
    } else if (data.type === 'LEAVE') {
      handlePeerDisconnection(data.peerId);
    }
  });

  c.on('close', () => {
    handlePeerDisconnection(c.peer);
  });
}

function handlePeerDisconnection(peerId) {
  if (isHost) {
    playersList = playersList.filter(item => item.id !== peerId);
    hostConnMap.delete(peerId);
    broadcastState();
    checkHostAloneDuringGame();
  } else {
    if (peerId === roomId || (guestConn && guestConn.peer === peerId)) {
      alert('ホストとの接続が切れました。');
      leaveRoomAndHome();
    }
  }
}

function broadcastState() {
  if (!isHost) return;
  broadcast({ type: 'STATE_UPDATE', playersList: playersList });
  renderLobbyPlayerList();
}

function renderLobbyPlayerList() {
  const listEl = document.getElementById('player-list-ui');
  listEl.innerHTML = '';
  playersList.forEach(p => {
    const isMe = p.id === myPeerId;
    const isHostUser = p.id === roomId;

    listEl.innerHTML += `
      <li class="player-item">
        <span>${p.name}${isMe ? ' (あなた)' : ''}${isHostUser ? ' [ホスト]' : ''}</span>
        <div style="display:flex; gap:0.5rem; align-items:center;">
          <span class="status-badge ready">接続完了</span>
        </div>
      </li>
    `;
  });
  document.getElementById('participant-count').innerText = playersList.length;

  if (isHost) {
    document.getElementById('host-start-btn').style.display = 'block';
    document.getElementById('host-close-room-btn').style.display = 'block';
    document.getElementById('guest-wait-msg').style.display = 'none';
    document.getElementById('guest-leave-btn').style.display = 'none';
  } else {
    document.getElementById('host-start-btn').style.display = 'none';
    document.getElementById('host-close-room-btn').style.display = 'none';
    document.getElementById('guest-wait-msg').style.display = 'block';
    document.getElementById('guest-leave-btn').style.display = 'block';
  }
}

async function copyShareUrl() {
  const urlText = document.getElementById('share-url-display').innerText;
  const shareData = { title: '英単語タイピング', text: '対戦部屋に参加しよう！', url: urlText };

  if (navigator.share) {
    try { await navigator.share(shareData); } catch (err) {}
  } else {
    try {
      await navigator.clipboard.writeText(urlText);
      const btn = document.getElementById('copy-btn');
      btn.innerText = "コピー完了";
      setTimeout(() => { btn.innerText = "部屋のURLを共有 / コピー"; }, 2000);
    } catch (err) {
      alert('コピーに失敗しました。');
    }
  }
}

function hostCloseRoom() {
  if (confirm('部屋を解散してよろしいですか？')) {
    broadcast({ type: 'CLOSE_ROOM' });
    leaveRoomAndHome();
  }
}

function hostStartGame() {
  if (playersList.length < 2) {
    alert("対戦には2人以上の参加者が必要です。");
    return;
  }

  const generatedQuiz = generateMultiQuizList();
  if (!generatedQuiz) return;

  isGameStarted = true;
  currentQuizList = generatedQuiz;
  currentQuestionIndex = 0;
  correctCount = 0;
  playersList.forEach(p => { p.score = 0; p.finishedQ = false; });

  broadcast({ type: 'START_GAME', quizList: currentQuizList });

  switchScreen('game-screen');
  document.getElementById('score-board').style.display = 'flex';
  
  runCountdown(() => {
    loadQuestion();
  });
}

function checkHostAloneDuringGame() {
  if (!isHost || !isGameStarted) return;
  if (playersList.length <= 1) {
    alert('他のプレイヤーが全員退出したため、ゲームを終了します。');
    isGameStarted = false;
    backToLobbySettings();

  document.getElementById('host-close-room-btn').style.display = 'block';

function backToLobbySettingsGuest() {
  isGameStarted = false;
  switchScreen('multi-lobby-screen');
  document.getElementById('host-settings-card').style.display = 'none';
  document.getElementById('room-waiting-box').style.display = 'block';
  document.getElementById('host-start-btn').style.display = 'none';
  document.getElementById('host-close-room-btn').style.display = 'none';
  document.getElementById('guest-wait-msg').style.display = 'block';
  document.getElementById('guest-leave-btn').style.display = 'block';

function handleResultBack() {
  if (mode === 'solo') {
    switchScreen('solo-setup-screen');
  } else {
    leaveRoomAndHome();
  }
}

function quitGame() {
  if (confirm('ゲームを中断してホームに戻りますか？')) {
    leaveRoomAndHome();
  }
}

function leaveRoomAndHome() {
  clearInterval(timerId);
  isAnswerable = false;
  isGameStarted = false;

  if (mode === 'multi') {
    broadcast({ type: 'LEAVE', peerId: myPeerId });
    if (guestConn) try { guestConn.close(); } catch(e){}
    hostConnMap.forEach(c => { try { c.close(); } catch(e){} });
    hostConnMap.clear();
    if (peer) peer.destroy();
  }

  window.history.replaceState({}, document.title, window.location.pathname);
  document.getElementById('multi-create-card').style.display = 'block';
  document.getElementById('multi-join-card').style.display = 'block';
  document.getElementById('room-waiting-box').style.display = 'none';
  document.getElementById('host-settings-card').style.display = 'none';
  document.getElementById('host-close-room-btn').style.display = 'none';
  document.getElementById('guest-leave-btn').style.display = 'none';
  document.getElementById('lobby-back-btn').style.display = 'block';
  switchScreen('home-screen');
}

function loadQuestion() {
  clearInterval(timerId);
  document.getElementById('msg-overlay').style.display = 'none';
  document.getElementById('controls-area').style.display = 'block';

  currentWord = currentQuizList[currentQuestionIndex];
  currentCharIndex = 1; 
  timeLeft = 6.0; 
  isAnswerable = true;

  document.getElementById('question-progress').innerText = `Q ${currentQuestionIndex + 1}/${currentQuizList.length}`;
  updateScoreBoard();
    
  document.getElementById('word-id').innerText = `No. ${currentWord.id}`;
  document.getElementById('jp-word').innerText = currentWord.jp;

  const display = document.getElementById('word-display');
  display.innerHTML = '';
  
  for (let i = 0; i < currentWord.en.length; i++) {
    const box = document.createElement('div');
    box.id = `char-${i}`;
    if (i === 0) {
      box.className = 'char-box filled';
      box.innerText = currentWord.en[0];
    } else if (i === 1) {
      box.className = 'char-box current';
    } else {
      box.className = 'char-box';
    }
    display.appendChild(box);
  }

  updateChoices();
  startTimer();
}

function updateScoreBoard() {
  const sb = document.getElementById('score-board');
  if (mode === 'multi') {
    sb.innerHTML = '';
    const myP = playersList.find(p => p.id === myPeerId);
    if (myP) myP.score = correctCount;

    playersList.forEach(p => {
      const isMe = p.id === myPeerId;
      sb.innerHTML += `
        <div class="score-row">
          <span>${p.name}${isMe ? ' (あなた)' : ''}:</span>
          <strong>${p.score}問</strong>
        </div>
      `;
    });
  }
}

function startTimer() {
  const bar = document.getElementById('timer-bar');
  const timeNum = document.getElementById('time-num');
  const step = 50;
  
  timerId = setInterval(() => {
    if (!isAnswerable) return;
    timeLeft -= step / 1000;
    if (timeLeft < 0) timeLeft = 0;
    if (timeLeft > MAX_TIME) timeLeft = MAX_TIME;
    
    timeNum.innerText = timeLeft.toFixed(1);
    const pct = (timeLeft / MAX_TIME) * 100;
    bar.style.width = Math.max(0, pct) + '%';

    if (timeLeft <= 0) {
      clearInterval(timerId);
      playSound('miss');
      handleFinishQuestion(false);
    }
  }, step);
}

function updateChoices() {
  if (currentCharIndex >= currentWord.en.length) return;

  const correctChar = currentWord.en[currentCharIndex].toLowerCase();
  const alphabet = "abcdefghijklmnopqrstuvwxyz";
  
  let choices = [correctChar];
  while (choices.length < 4) {
    const randomChar = alphabet[Math.floor(Math.random() * alphabet.length)];
    if (!choices.includes(randomChar)) {
      choices.push(randomChar);
    }
  }

  choices.sort(() => Math.random() - 0.5);

  const btns = document.querySelectorAll('.choice-btn');
  btns.forEach((btn, idx) => {
    btn.innerText = choices[idx];
    btn.onclick = () => {
      playSound('type');
      handleInput(choices[idx]);
    };
  });
}

function handleInput(selectedChar) {
  if (!isAnswerable) return;

  const correctChar = currentWord.en[currentCharIndex].toLowerCase();

  if (selectedChar === correctChar) {
    timeLeft = Math.min(MAX_TIME, timeLeft + 2.0);
    
    const box = document.getElementById(`char-${currentCharIndex}`);
    box.innerText = correctChar;
    box.classList.remove('current');
    box.classList.add('filled');

    currentCharIndex++;

    if (currentCharIndex < currentWord.en.length) {
      playSound('char_correct');
      document.getElementById(`char-${currentCharIndex}`).classList.add('current');
      updateChoices();
    } else {
      isAnswerable = false;
      clearInterval(timerId);
      correctCount++;
      playSound('word_correct');
      updateScoreBoard();

      handleFinishQuestion(true);
    }
  } else {
    playSound('miss');
    handleFinishQuestion(false);
  }
}

function handleFinishQuestion(isSuccess) {
  isAnswerable = false;
  clearInterval(timerId);

  const myP = playersList.find(p => p.id === myPeerId);
  if (myP) {
    myP.finishedQ = true;
    myP.score = correctCount;
  }

  if (mode === 'multi') {
    if (isHost) {
      checkAllFinishedQuestion();
    } else {
      guestConn.send({ type: 'PLAYER_FINISH_Q', peerId: myPeerId, score: correctCount });
    }
  }

  document.getElementById('controls-area').style.display = 'none';
  const titleEl = document.getElementById('msg-title');
  const subEl = document.getElementById('msg-sub');

  if (isSuccess) {
    titleEl.innerText = `正解 (${currentWord.en})`;
    titleEl.style.color = 'var(--accent-green)';
  } else {
    titleEl.innerText = `不正解 / タイムアップ (正解: ${currentWord.en})`;
    titleEl.style.color = 'var(--accent-red)';
  }

  document.getElementById('msg-overlay').style.display = 'block';

  if (mode === 'solo') {
    subEl.innerText = "次の問題へ進みます...";
    setTimeout(nextQuestion, 1200);
  } else {
    subEl.innerText = "他のプレイヤーの回答を待っています...";
  }
}

function checkAllFinishedQuestion() {
  if (!isHost) return;

  const allFinished = playersList.every(p => p.finishedQ);
  if (allFinished) {
    setTimeout(() => {
      playersList.forEach(p => p.finishedQ = false);

      currentQuestionIndex++;
      if (currentQuestionIndex < currentQuizList.length) {
        loadQuestion();
        broadcast({
          type: 'NEXT_QUESTION',
          quizList: currentQuizList,
          questionIndex: currentQuestionIndex,
          playersList: playersList
        });
      } else {
        isGameStarted = false;
        showResult();
        broadcast({
          type: 'SHOW_RESULT',
          playersList: playersList
        });
      }
    }, 1200);
  }
}

function nextQuestion() {
  currentQuestionIndex++;
  if (currentQuestionIndex < currentQuizList.length) {
    loadQuestion();
  } else {
    showResult();
  }
}

function showResult() {
  isGameStarted = false;
  switchScreen('result-screen');
  
  const subtitleEl = document.getElementById('result-subtitle');
  const rankingEl = document.getElementById('final-ranking-list');
  const multiRestartBtn = document.getElementById('multi-restart-btn');
  const guestRestartMsg = document.getElementById('guest-restart-msg');
  const guestBackLobbyBtn = document.getElementById('guest-back-lobby-btn');
  const backBtn = document.getElementById('result-back-btn');

  if (mode === 'solo') {
    subtitleEl.innerText = "1人用モード結果";
    multiRestartBtn.style.display = 'none';
    guestRestartMsg.style.display = 'none';
    guestBackLobbyBtn.style.display = 'none';
    backBtn.style.display = 'block';
    backBtn.innerText = "設定画面に戻る";
    rankingEl.innerHTML = `
      <div class="player-item" style="font-size: 0.95rem; padding: 0.7rem 1rem;">
        <span>${myName} の正解数</span>
        <strong>${correctCount} / ${currentQuizList.length} 問</strong>
      </div>
    `;
  } else {
    const sorted = [...playersList].sort((a, b) => b.score - a.score);
    if (sorted.length > 0 && sorted[0].score > (sorted[1]?.score ?? -1)) {
      subtitleEl.innerText = `勝者: ${sorted[0].name} さん！`;
    } else {
      subtitleEl.innerText = "引き分け！";
    }

    if (isHost) {
      multiRestartBtn.style.display = 'block';
      guestRestartMsg.style.display = 'none';
      guestBackLobbyBtn.style.display = 'none';
      backBtn.style.display = 'block';
      backBtn.innerText = "ゲームから退出する";
    } else {
      multiRestartBtn.style.display = 'none';
      guestRestartMsg.style.display = 'block';
      guestBackLobbyBtn.style.display = 'block';
      backBtn.style.display = 'block';
      backBtn.innerText = "ゲームから退出する";
    }

    rankingEl.innerHTML = '';
    sorted.forEach((p, idx) => {
      const isMe = p.id === myPeerId;
      rankingEl.innerHTML += `
        <div class="player-item" style="font-size: 0.95rem; padding: 0.7rem 1rem;">
          <span>${idx + 1}位: ${p.name}${isMe ? ' (あなた)' : ''}</span>
          <strong>${p.score} 問正解</strong>
        </div>
      `;
    });
  }
}

window.addEventListener('keydown', (e) => {
  if (!isAnswerable) return;
  const key = e.key.toLowerCase();
  if (key >= 'a' && key <= 'z' && key.length === 1) {
    const btns = document.querySelectorAll('.choice-btn');
    btns.forEach(btn => {
      if (btn.innerText === key) {
        playSound('type');
        handleInput(key);
      }
    });
  }
});
</script>

</body>
</html>
